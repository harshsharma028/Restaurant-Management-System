<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-md shadow-md w-96">

    <h2 class="text-2xl font-bold mb-4">Login</h2>

    <input type="email" name="email" required [(ngModel)]="loginData().email" placeholder="Email"
      class="w-full mb-3 p-2 border rounded" />

    <input type="password" name="password" required [(ngModel)]="loginData().password" placeholder="Password"
      class="w-full mb-4 p-2 border rounded" />

    <button type="submit" [disabled]="!loginForm.valid"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
      Login
    </button>

  </form>
</div>
