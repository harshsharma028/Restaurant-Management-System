<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-md shadow-md w-96">

    <h2 class="text-2xl font-bold mb-4">Sign Up</h2>

    <input type="text" formControlName="name" placeholder="Name" class="w-full mb-3 p-2 border rounded" />

    <input type="email" formControlName="email" placeholder="Email" class="w-full mb-3 p-2 border rounded" />

    <input type="password" formControlName="password" placeholder="Password" class="w-full mb-4 p-2 border rounded" />

    <button type="submit" [disabled]="!isFormValid()"
      class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
      Sign Up
    </button>

  </form>
</div>
