<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="col-md-5 col-lg-4">

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="p-4 shadow rounded bg-white">

      <h3 class="text-center mb-3">Login</h3>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="Enter email" />

        <small class="text-danger" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Please enter a valid email
        </small>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" placeholder="Enter password" />

        <small class="text-danger" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password must be at least 6 characters
        </small>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary w-100">
        Login
      </button>

    </form>

  </div>
</div>
