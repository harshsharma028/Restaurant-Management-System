<div class="welcome-wrapper d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">

        <!-- Website Heading -->
        <h1 class="site-title mb-3">
          Welcome to <span>YourApp</span>
        </h1>

        <!-- Sub Heading -->
        <h5 class="site-subtitle mb-4">
          Build. Secure. Scale.
        </h5>

        <!-- Description -->
        <p class="site-description mb-5">
          YourApp is a modern platform designed to help you manage users,
          authentication, and dashboards with speed and security.
          Experience a clean interface, fast performance, and scalable architecture.
        </p>

        <!-- Buttons -->
        <div class="d-flex justify-content-between auth-buttons">
          <button (click)="userNavigate('signup')" class="btn btn-outline-primary px-5 py-2">
            Sign Up
          </button>

          <button (click)="userNavigate('login')" class="btn btn-primary px-5 py-2">
            Login
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
